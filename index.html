<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f8" />
    <meta name="description" content="tangsu.me 个人网址导航，整理收集个人常用网站。" />
    <meta property="og:title" content="tangsu.me - 个人网址导航" />
    <meta property="og:description" content="整理收集个人常用网站" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nest.tangsu.me/" />
    <link rel="canonical" href="https://nest.tangsu.me/" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/images/brand/tangsu-swirl-favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/brand/tangsu-swirl-touch.png" />
    <title>tangsu.me - 个人网址导航</title>
    <script>
      try {
        const preference = JSON.parse(localStorage.getItem('linknest:theme') || '"auto"');
        document.documentElement.dataset.theme = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>请启用 JavaScript 以使用网址导航。 Enable JavaScript to browse this directory.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
